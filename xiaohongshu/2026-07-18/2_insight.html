<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px; height: 1440px;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; align-items: center; justify-content: center;
}

body { background: #F5F3FF; }
.card {
    width: 960px;
    background: white;
    border-radius: 32px;
    padding: 64px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.pillar {
    font-size: 28px; color: #7C3AED;
    margin-bottom: 28px;
    font-weight: 600;
    letter-spacing: 1px;
}
.title {
    font-size: 52px; font-weight: 700; color: #1a1a1a;
    line-height: 1.4; letter-spacing: -1px;
    margin-bottom: 48px;
}
.divider {
    width: 80px; height: 5px;
    background: #7C3AED;
    border-radius: 3px;
    margin-bottom: 40px;
}
.label {
    font-size: 26px; color: #7C3AED;
    font-weight: 600;
    margin-bottom: 28px;
    letter-spacing: 2px;
}
.evidence {
    display: flex; align-items: flex-start; gap: 18px;
    padding: 22px 0;
}
.evidence-dot {
    width: 16px; height: 16px;
    background: #7C3AED;
    border-radius: 50%;
    margin-top: 14px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(124,58,237,0.3);
}
.evidence-text {
    font-size: 36px; color: #333;
    line-height: 1.5;
}
.count {
    margin-top: 48px;
    padding: 32px;
    background: #F5F3FF;
    border-radius: 20px;
    font-size: 32px;
    color: #7C3AED;
    font-weight: 600;
    text-align: center;
}
.footer {
    margin-top: 40px;
    text-align: center;
    font-size: 24px;
    color: #bbb;
}
</style></head>
<body>
<div class="card">
    <div class="pillar">💰 商业趋势</div>
    <div class="title">苹果起诉OpenAI，AI人才争夺战升级</div>
    <div class="divider"></div>
    <div class="label">📌 关键信号</div>
    
        <div class="evidence">
            <div class="evidence-dot"></div>
            <div class="evidence-text">苹果向OpenAI员工发律师函</div>
        </div>
        <div class="evidence">
            <div class="evidence-dot"></div>
            <div class="evidence-text">苹果大诉讼或阻碍OpenAI上市</div>
        </div>
        <div class="evidence">
            <div class="evidence-dot"></div>
            <div class="evidence-text">苹果诉讼来得真不是时候</div>
        </div>
    <div class="count">📊 共 5 条证据支撑</div>
    <div class="footer">💡 AI Radar · 2026-07-18</div>
</div>
</body></html>
