<!DOCTYPE html>
<html>
<head>
    <title>性能测试 - vis-network 渲染</title>
    <script src="./assets/vis-network.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #log { background: #f0f0f0; padding: 10px; margin: 10px 0; font-family: monospace; }
        #mynetwork { width: 100%; height: 600px; border: 1px solid #ccc; }
        .slow { color: red; font-weight: bold; }
        .fast { color: green; }
    </style>
</head>
<body>
    <h1>vis-network 性能测试</h1>
    <div id="log"></div>
    <div id="mynetwork"></div>
    
    <script>
        const logEl = document.getElementById('log');
        function log(msg, isSlow = false) {
            const div = document.createElement('div');
            div.innerHTML = msg;
            if (isSlow) div.className = 'slow';
            else div.className = 'fast';
            logEl.appendChild(div);
            console.log(msg);
        }
        
        async function test() {
            const startTime = performance.now();
            log('开始测试...');
            
            // 1. 加载 graph.json
            log('1. 加载 graph.json...');
            const t1 = performance.now();
            try {
                const resp = await fetch('./graph.json');
                const fullData = await resp.json();
                const t2 = performance.now();
                log(`   ✓ 下载+解析: ${(t2-t1).toFixed(0)}ms (${fullData.nodes.length} 节点, ${fullData.edges.length} 边)`);
                
                // 2. 过滤数据（模拟 Explorer 的精简逻辑）
                log('2. 过滤数据 (PM Score >= 0.5)...');
                const t3 = performance.now();
                const filteredNodes = fullData.nodes.filter(n => (n.pm_score || 0) >= 0.5);
                const filteredIds = new Set(filteredNodes.map(n => n.id));
                const filteredEdges = fullData.edges.filter(e => {
                    if (e.type === 'KEYWORD') return false;
                    const src = e.source || e.from;
                    const tgt = e.target || e.to;
                    return filteredIds.has(src) && filteredIds.has(tgt);
                });
                const t4 = performance.now();
                log(`   ✓ 过滤: ${(t4-t3).toFixed(0)}ms (${filteredNodes.length} 节点, ${filteredEdges.length} 边)`);
                
                // 3. 创建 vis-network DataSet
                log('3. 创建 vis.DataSet...');
                const t5 = performance.now();
                const nodes = new vis.DataSet(filteredNodes.map(n => ({
                    id: n.id,
                    label: (n.label || '').slice(0, 20),
                    color: n.source_type === 'twitter' ? '#1DA1F2' : 
                           n.pillar === 'capabilities' ? '#58a6ff' : 
                           n.pillar === 'patterns' ? '#3fb950' : 
                           n.pillar === 'ecosystem' ? '#a371f7' : '#f0883e',
                    size: Math.max(10, Math.min(28, (n.pm_score || 0.1) * 30 + 10))
                })));
                const edges = new vis.DataSet(filteredEdges.map(e => ({
                    from: e.source || e.from,
                    to: e.target || e.to
                })));
                const t6 = performance.now();
                log(`   ✓ DataSet: ${(t6-t5).toFixed(0)}ms`);
                
                // 4. 初始化 vis-network
                log('4. 初始化 vis.Network...');
                const t7 = performance.now();
                const container = document.getElementById('mynetwork');
                const network = new vis.Network(container, { nodes, edges }, {
                    physics: {
                        barnesHut: { gravitationalConstant: -3000, springLength: 150 },
                        stabilization: { iterations: 100 }
                    },
                    interaction: { hover: false, dragView: true, zoomView: true }
                });
                const t8 = performance.now();
                log(`   ✓ Network 创建: ${(t8-t7).toFixed(0)}ms`);
                
                // 5. 等待稳定化完成
                log('5. 等待物理引擎稳定化...');
                network.once('stabilizationIterationsDone', function() {
                    const t9 = performance.now();
                    log(`   ✓ 稳定化完成: ${(t9-t8).toFixed(0)}ms`);
                    
                    const totalTime = t9 - startTime;
                    log(`<br><b>总时间: ${totalTime.toFixed(0)}ms</b>`, totalTime > 3000);
                    
                    // 瓶颈分析
                    log('<br><b>瓶颈分析:</b>');
                    const phases = [
                        ['下载+解析', t2-t1],
                        ['过滤', t4-t3],
                        ['DataSet', t6-t5],
                        ['Network 创建', t8-t7],
                        ['稳定化', t9-t8]
                    ];
                    phases.forEach(([name, duration]) => {
                        const pct = (duration / totalTime * 100).toFixed(0);
                        const isSlow = duration > 1000;
                        log(`  ${name}: ${duration.toFixed(0)}ms (${pct}%)`, isSlow);
                    });
                    
                    // 建议
                    log('<br><b>优化建议:</b>');
                    if (t2-t1 > 1000) log('  ⚠️ 下载/解析慢 → 压缩文件或分页加载');
                    if (t8-t7 > 1000) log('  ⚠️ Network 创建慢 → 减少节点数或禁用物理引擎');
                    if (t9-t8 > 1000) log('  ⚠️ 稳定化慢 → 减少迭代次数或禁用物理引擎');
                });
                
            } catch (err) {
                log(`❌ 错误: ${err.message}`, true);
            }
        }
        
        // 页面加载完成后开始测试
        window.addEventListener('load', test);
    </script>
</body>
</html>
